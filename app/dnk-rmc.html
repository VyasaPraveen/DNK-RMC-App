<body>
<style>
/* ============ DNK Power Conmix — RMC Billing & Plant Management ============ */
:root{
  --brand:#14508c;          /* logo royal blue */
  --brand-dark:#0f3e6e;
  --brand-light:#eaf1fa;    /* soft blue for hovers */
  --accent:#f0b323;         /* logo gold — used sparingly */
  --green:#16a34a;
  --danger:#e11d48;
  --bg:#f4f6fa;
  --panel:#ffffff;
  --line:#e6eaf1;
  --line-soft:#eef1f6;
  --text:#1e2a3a;
  --text-2:#465366;
  --muted:#7d8899;
  --radius:12px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.05);
  --shadow-md:0 6px 24px rgba(16,24,40,.09);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--brand);text-decoration:none}
h1,h2,h3{letter-spacing:-.2px}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#0f3e6e 0%,#14508c 55%,#1a5ea3 100%)}
.login-split{display:flex;width:860px;max-width:100%;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(8,22,40,.45)}
.login-left{flex:1;background:linear-gradient(165deg,#14508c,#0f3e6e);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:46px 34px;text-align:center;color:#fff}
.login-left img{width:150px;height:150px;object-fit:contain;border-radius:20px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.login-left h1{font-size:19px;margin:22px 0 4px;letter-spacing:.4px}
.login-left .tag{color:var(--accent);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.login-left p{color:#cfe0f2;font-size:12px;margin:14px 0 0;line-height:1.7}
.login-right{width:390px;max-width:100%;padding:48px 42px;display:flex;flex-direction:column;justify-content:center}
.login-right h2{margin:0 0 5px;color:var(--text);font-size:24px;font-weight:700}
.login-right .sub{color:var(--muted);font-size:13px;margin-bottom:26px}
.login-row{display:flex;justify-content:flex-end;margin:11px 0 4px}
.link{color:var(--brand);cursor:pointer;font-size:12.5px;font-weight:600}
.link:hover{text-decoration:underline}
.pwd-wrap{position:relative;display:flex;align-items:center}
.pwd-wrap input{padding-right:42px}
.pwd-eye{position:absolute;right:6px;background:none;border:none;cursor:pointer;font-size:15px;opacity:.45;padding:4px 8px;line-height:1}
.pwd-eye.on,.pwd-eye:hover{opacity:.85}
.static-field{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#f4f6f9;color:var(--text);font-size:13px}
@media(max-width:760px){.login-left{display:none}.login-right{width:100%}}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:var(--bg)}
.sidebar{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:24px}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.brand img{width:40px;height:40px;object-fit:contain;border-radius:9px}
.brand .bt{font-weight:700;font-size:13px;color:var(--text);line-height:1.2}
.brand .bs{font-size:9px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.nav{margin-top:4px;padding:0 10px}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;color:var(--text-2);font-size:13.5px;cursor:pointer;border-radius:9px;margin:1px 0;font-weight:500;transition:.12s}
.nav a:hover{background:var(--brand-light);color:var(--brand)}
.nav a.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(20,80,140,.3)}
.nav a .ic{width:18px;text-align:center;font-size:14px}
.nav a .nt{flex:1}

.main{padding:24px 28px;overflow:auto}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:14px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:22px;color:var(--text);font-weight:700}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:3px}
.userchip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:6px 8px 6px 12px}
.userchip b{color:var(--text)}

/* ---------- Components ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hd{padding:15px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .hd h3{margin:0;font-size:15px;font-weight:650}
.card .bd{padding:18px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;margin-top:8px;color:var(--text)}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px}
.kpi.accent{border-top:3px solid var(--accent)}
.kpi.green{border-top:3px solid var(--green)}
.kpi.blue{border-top:3px solid var(--brand)}
.kpi.red{border-top:3px solid var(--danger)}
.kpi.gold{border-top:3px solid var(--accent)}

/* Dashboard KPI cards + recent lists */
.dashkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.dashkpi{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.dashkpi .k-lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.dashkpi .k-val{font-size:27px;font-weight:800;margin-top:12px;color:var(--text);line-height:1.1}
.dashkpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:6px}
.dashkpi .k-ic{position:absolute;top:16px;right:16px;font-size:15px;opacity:.4}
.dashcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.dashrow{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-top:1px solid var(--line-soft);font-size:13px}
.dashrow:first-child{border-top:none}
.dashrow .r-l{color:var(--text)}
.dashrow .r-l .r-sub{color:var(--muted);margin-left:8px;font-size:12px}
.dashrow .r-r{font-weight:700;color:var(--text);white-space:nowrap}
.dashrow .r-r .r-q{color:var(--muted);font-weight:500;margin-right:10px}
.dashrow a.r-l{color:var(--brand);cursor:pointer;font-weight:600}
.dashrow a.r-l:hover{text-decoration:underline}
@media(max-width:1000px){.dashkpis{grid-template-columns:repeat(2,1fr)}.dashcols{grid-template-columns:1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:#fff;border:none;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;transition:.14s;line-height:1.2}
.btn:hover{background:var(--brand-dark)}
.btn.primary{background:var(--brand)}.btn.primary:hover{background:var(--brand-dark)}
.btn.block{width:100%;margin-top:10px;padding:12px}
.btn.gold{background:var(--accent);color:#3a2e00}.btn.gold:hover{filter:brightness(.96)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}.btn.ghost:hover{background:var(--brand-light);border-color:var(--brand-light)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.danger{background:var(--danger)}.btn.danger:hover{filter:brightness(.94)}
.btn.green{background:var(--green)}.btn.green:hover{filter:brightness(.94)}

/* Tables */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:11px 14px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);background:#f8fafc;font-weight:700}
.table td{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:#f9fbfe}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.right{text-align:right}
.muted{color:var(--muted)}

/* Pills */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.pill.paid{background:#e7f7ec;color:#137a37}
.pill.due{background:#fdeaee;color:#c11c43}
.pill.part{background:#fff4e2;color:#a86b00}
.pill.igst{background:#eaecfb;color:#3b46b0}
.pill.gst{background:#e7f7ec;color:#137a37}
.pill.nogst{background:#eaf1fa;color:#14508c}
.pill.low{background:#fdeaee;color:#c11c43}
.pill.ok2{background:#e7f7ec;color:#137a37}
.stock-low{color:var(--danger)}

/* Attendance buttons */
.att-btns{display:inline-flex;gap:5px}
.att-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;font-weight:800;font-size:12px;color:var(--muted)}
.att-btn:hover{border-color:var(--brand)}
.att-btn.P.on{background:#e7f7ec;border-color:#16a34a;color:#137a37}
.att-btn.A.on{background:#fdeaee;border-color:#e11d48;color:#c11c43}
.att-btn.H.on{background:#fff4e2;border-color:#e0a400;color:#a86b00}
.att-btn.L.on{background:#eaecfb;border-color:#3b46b0;color:#3b46b0}

/* Permission checkbox grid */
.permgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.permchk{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text);background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer}
.permchk input{width:auto}
@media(max-width:600px){.permgrid{grid-template-columns:1fr 1fr}}

/* Feature toggles */
.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.feature-row{display:flex;align-items:center;justify-content:space-between;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:500;color:var(--text)}
.switch{appearance:none;-webkit-appearance:none;width:40px;height:22px;background:#cbd5e1;border-radius:20px;position:relative;cursor:pointer;transition:.2s;flex:none;margin:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch:checked{background:var(--green)}
.switch:checked::after{left:20px}
@media(max-width:640px){.feature-grid{grid-template-columns:1fr}}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--text-2);font-weight:600}
input,select,textarea{font-family:inherit;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);width:100%}
input::placeholder,textarea::placeholder{color:#a9b2bf}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(20,80,140,.12)}
input[readonly]{background:#f4f6f9;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:200px}
.empty{padding:44px;text-align:center;color:var(--muted)}

/* Summary / calc box */
.calc{background:#f7f9fc;border:1px solid var(--line);border-radius:11px;padding:15px}
.calc .row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.calc .row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:11px;font-weight:700;font-size:16px;color:var(--brand-dark)}
.calc .words{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,24,38,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:14px;width:640px;max-width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.32)}
.modal .mhd{padding:17px 20px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.modal .mhd h3{margin:0;font-size:16px}
.modal .mbd{padding:20px}
.modal .mft{padding:15px 20px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:10px}
.x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;border:none;background:none}

/* Toast */
.toast{position:fixed;bottom:64px;right:22px;background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:13px;z-index:100;opacity:0;transform:translateY(10px);transition:.25s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--green)}.toast.err{background:var(--danger)}

/* Cloud sync badge */
/* Bottom-right so it never overlaps the left navigation menu. */
.cloud-badge{position:fixed;bottom:18px;right:18px;left:auto;z-index:90;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;cursor:pointer;user-select:none;box-shadow:0 4px 14px rgba(0,0,0,.12);border:1px solid var(--line);background:#fff;color:var(--muted);transition:.2s}
.cloud-badge.ok{background:#e8f6ee;color:#0a7c33;border-color:#bfe6cd}
.cloud-badge.err{background:#fdeaea;color:#b42323;border-color:#f2c4c4}
.cloud-badge.off{background:#f1f4f8;color:#64748b}

/* Print overlay */
#printOverlay{position:fixed;inset:0;z-index:200;background:rgba(13,30,52,.75);display:flex;flex-direction:column;align-items:center;padding:0}
#printOverlay .po-bar{width:100%;background:var(--brand-dark);color:#fff;padding:10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#printOverlay .po-bar b{margin-right:8px}
#printOverlay .po-bar button{border:none;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer;font-size:13px}
#printOverlay .po-print{background:var(--accent);color:#3a2e00}
#printOverlay .po-close{background:#fff;color:var(--brand-dark)}
#printOverlay .po-frame{flex:1;width:100%;max-width:850px;border:none;background:#fff;margin:14px 0;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* ---------- Mobile: off-canvas drawer + scrollable tables ---------- */
.burger{display:none}
.nav-scrim{display:none}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:250px;z-index:60;transform:translateX(-100%);transition:transform .22s ease;box-shadow:6px 0 30px rgba(0,0,0,.22)}
  .app.nav-open .sidebar{transform:translateX(0)}
  .app.nav-open .nav-scrim{display:block}
  .nav-scrim{position:fixed;inset:0;background:rgba(15,24,38,.45);z-index:55}
  .burger{display:flex;align-items:center;justify-content:center;position:fixed;top:10px;left:10px;z-index:50;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--brand);font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
  .main{padding:16px 15px 26px}
  .topbar{padding-left:46px}
  .topbar h2{font-size:19px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .card .bd{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table th,.table td{white-space:nowrap}
  [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  .modal{width:100%}
  .toolbar .search{min-width:0}
}
@media(max-width:420px){.kpis{grid-template-columns:1fr}}

</style>

window.MANUAL_HTML="\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003ctitle>DNK RMC Handbook\u003c/title>\n\u003cmeta name=\"description\" content=\"Feature guide and how-to documentation for the DNK Power Conmix RMC billing & plant-management system, by EPIXS Media.\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n\u003cstyle>\n:root{\n  --paper:#ffffff;\n  --ground:#eef1f5;\n  --panel:#f7f9fc;\n  --ink:#16233a;\n  --ink-soft:#4c5c74;\n  --muted:#7b8798;\n  --line:#dbe2ec;\n  --line-soft:#e8edf4;\n  --brand:#14508c;\n  --brand-deep:#0f3e6e;\n  --brand-tint:#e9f1fa;\n  --gold:#b07d10;\n  --gold-bright:#f0b323;\n  --green:#15833f;\n  --green-tint:#e6f4ea;\n  --red:#c1273f;\n  --red-tint:#fbeaed;\n  --shadow:0 1px 2px rgba(16,32,58,.05),0 6px 22px rgba(16,32,58,.07);\n  --shadow-sm:0 1px 2px rgba(16,32,58,.06);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --paper:#141d2e;\n    --ground:#0d1522;\n    --panel:#182339;\n    --ink:#e9eff7;\n    --ink-soft:#aebccf;\n    --muted:#7f8ea3;\n    --line:#28374f;\n    --line-soft:#212f45;\n    --brand:#5b9bd8;\n    --brand-deep:#7cb2e6;\n    --brand-tint:#17273f;\n    --gold:#e6b23e;\n    --gold-bright:#f3c661;\n    --green:#4fc47d;\n    --green-tint:#132a1f;\n    --red:#f0788a;\n    --red-tint:#2a1720;\n    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.34);\n    --shadow-sm:0 1px 2px rgba(0,0,0,.4);\n  }\n}\n:root[data-theme=\"dark\"]{\n  --paper:#141d2e;\n  --ground:#0d1522;\n  --panel:#182339;\n  --ink:#e9eff7;\n  --ink-soft:#aebccf;\n  --muted:#7f8ea3;\n  --line:#28374f;\n  --line-soft:#212f45;\n  --brand:#5b9bd8;\n  --brand-deep:#7cb2e6;\n  --brand-tint:#17273f;\n  --gold:#e6b23e;\n  --gold-bright:#f3c661;\n  --green:#4fc47d;\n  --green-tint:#132a1f;\n  --red:#f0788a;\n  --red-tint:#2a1720;\n  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.34);\n  --shadow-sm:0 1px 2px rgba(0,0,0,.4);\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth;scroll-padding-top:24px}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\nbody{\n  margin:0;background:var(--ground);color:var(--ink);\n  font-family:\"IBM Plex Sans\",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;\n  font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased;\n}\nh1,h2,h3,h4{font-family:\"Archivo\",\"IBM Plex Sans\",sans-serif;line-height:1.15;text-wrap:balance;margin:0}\na{color:var(--brand);text-decoration:none}\na:hover{text-decoration:underline}\ncode,.mono{font-family:\"IBM Plex Mono\",ui-monospace,SFMono-Regular,Menlo,monospace}\n:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}\n\n/* ---------- Cover ---------- */\n.cover{position:relative;overflow:hidden;background:linear-gradient(150deg,#0f3e6e 0%,#14508c 60%,#1a5ea3 100%);color:#fff}\n.cover .grid-bg{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(ellipse 80% 90% at 70% 10%,#000,transparent 78%)}\n.cover-inner{position:relative;max-width:1180px;margin:0 auto;padding:66px 40px 58px}\n.eyebrow{font-family:\"IBM Plex Mono\",monospace;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-bright);font-weight:500}\n.cover h1{font-size:clamp(38px,6vw,62px);font-weight:800;letter-spacing:-.02em;margin:20px 0 0}\n.cover .lede{font-size:clamp(17px,2.2vw,20px);color:#d6e5f5;max-width:60ch;margin:20px 0 0;line-height:1.55}\n.cover-badge{display:inline-flex;align-items:center;gap:12px;margin-bottom:6px}\n.cover-badge .mark{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:22px}\n.cover-badge .mark-txt{font-family:\"Archivo\";font-weight:800;font-size:15px;letter-spacing:.02em}\n.cover-badge .mark-txt small{display:block;font-family:\"IBM Plex Mono\";font-weight:400;font-size:10px;letter-spacing:.18em;color:#bcd3ec;text-transform:uppercase}\n.meta-row{display:flex;flex-wrap:wrap;gap:10px 12px;margin-top:34px}\n.meta-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-family:\"IBM Plex Mono\";color:#eaf2fb}\n.meta-chip b{color:#fff;font-weight:600}\n.meta-chip .dot{width:7px;height:7px;border-radius:50%;background:#4ade80}\n\n/* ---------- Layout ---------- */\n.wrap{max-width:1180px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:242px minmax(0,1fr);gap:52px;align-items:start}\n.toc{position:sticky;top:24px;align-self:start;padding:30px 0;max-height:calc(100vh - 40px);overflow:auto}\n.toc h5{font-family:\"IBM Plex Mono\";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}\n.toc ol{list-style:none;margin:0;padding:0;counter-reset:toc}\n.toc li{counter-increment:toc;margin:1px 0}\n.toc a{display:flex;gap:11px;align-items:baseline;padding:7px 12px;border-radius:8px;color:var(--ink-soft);font-size:14px;font-weight:500;line-height:1.3}\n.toc a::before{content:counter(toc,decimal-leading-zero);font-family:\"IBM Plex Mono\";font-size:11px;color:var(--gold);font-weight:600;flex:none}\n.toc a:hover{background:var(--brand-tint);color:var(--brand);text-decoration:none}\n.content{padding:40px 0 20px;min-width:0}\n\n/* ---------- Sections ---------- */\n.section{padding:22px 0 10px;border-top:1px solid var(--line);margin-top:30px}\n.section:first-of-type{border-top:none;margin-top:0}\n.sec-num{font-family:\"IBM Plex Mono\";font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:600;text-transform:uppercase}\n.section>h2{font-size:clamp(25px,3.4vw,32px);font-weight:800;letter-spacing:-.015em;margin:10px 0 0}\n.section>.intro{color:var(--ink-soft);font-size:17px;max-width:68ch;margin:14px 0 4px}\n.content p{max-width:70ch}\nh3.sub{font-size:20px;font-weight:700;margin:34px 0 4px;color:var(--ink);letter-spacing:-.01em}\n\n/* ---------- Feature cards ---------- */\n.feat{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-sm);padding:22px 24px;margin-top:18px}\n.feat-head{display:flex;align-items:center;gap:13px;margin-bottom:4px}\n.feat-ic{width:38px;height:38px;border-radius:10px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-size:19px;flex:none}\n.feat-head h4{font-size:18px;font-weight:700;letter-spacing:-.01em}\n.feat .what{color:var(--ink-soft);margin:2px 0 0;font-size:15.5px}\n.howto-label{font-family:\"IBM Plex Mono\";font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:18px 0 8px;display:block}\nol.steps{margin:0;padding:0;list-style:none;counter-reset:s}\nol.steps li{counter-increment:s;position:relative;padding:5px 0 5px 38px;font-size:15.5px;line-height:1.55}\nol.steps li::before{content:counter(s);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-family:\"IBM Plex Mono\";font-size:12px;font-weight:600;display:grid;place-items:center}\nol.steps li+li{border-top:1px solid var(--line-soft)}\n.kbd{font-family:\"IBM Plex Mono\";font-size:.86em;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink);white-space:nowrap}\n.path{font-family:\"IBM Plex Mono\";font-size:.85em;font-weight:500;color:var(--brand);background:var(--brand-tint);padding:2px 8px;border-radius:6px;white-space:nowrap}\n\n/* ---------- Callouts ---------- */\n.note{border-radius:12px;padding:15px 18px 15px 18px;margin:20px 0;font-size:15px;border:1px solid var(--line);background:var(--panel);position:relative}\n.note b.tag{display:block;font-family:\"IBM Plex Mono\";font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}\n.note.tip{background:var(--green-tint);border-color:color-mix(in srgb,var(--green) 30%,transparent)}\n.note.tip b.tag{color:var(--green)}\n.note.warn{background:var(--red-tint);border-color:color-mix(in srgb,var(--red) 32%,transparent)}\n.note.warn b.tag{color:var(--red)}\n.note.gold{background:color-mix(in srgb,var(--gold-bright) 14%,var(--paper));border-color:color-mix(in srgb,var(--gold) 40%,transparent)}\n.note.gold b.tag{color:var(--gold)}\n\n/* ---------- Tables ---------- */\n.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin:20px 0;box-shadow:var(--shadow-sm)}\ntable{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--paper)}\nth,td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--line-soft)}\nthead th{background:var(--panel);font-family:\"IBM Plex Mono\";font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}\ntbody tr:last-child td{border-bottom:none}\ntd .mono{font-size:.92em}\n\n/* pills */\n.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;font-family:\"IBM Plex Sans\"}\n.pill.b{background:var(--brand-tint);color:var(--brand)}\n.pill.g{background:var(--green-tint);color:var(--green)}\n.pill.r{background:var(--red-tint);color:var(--red)}\n\n/* two-column feature grids */\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.grid2 .feat{margin-top:0}\n\n/* ---------- Footer / contact ---------- */\n.support{margin-top:56px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}\n.support .top{background:linear-gradient(135deg,#0f3e6e,#14508c);color:#fff;padding:34px 34px 30px}\n.support .top .eyebrow{color:var(--gold-bright)}\n.support .top h2{font-size:27px;font-weight:800;margin:12px 0 8px;color:#fff}\n.support .top p{color:#cfe0f2;max-width:60ch;margin:0}\n.support .body{background:var(--paper);padding:30px 34px 32px;display:grid;grid-template-columns:1.1fr 1fr;gap:30px}\n.contact-list{display:flex;flex-direction:column;gap:2px}\n.contact-row{display:flex;gap:14px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line-soft)}\n.contact-row:first-child{border-top:none}\n.contact-row .ci{width:34px;height:34px;border-radius:9px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;font-size:16px;flex:none}\n.contact-row .cl{font-family:\"IBM Plex Mono\";font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}\n.contact-row .cv{font-size:15.5px;color:var(--ink);font-weight:500}\n.contact-row .cv a{font-weight:500}\n.social{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.social a{font-family:\"IBM Plex Mono\";font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink-soft);background:var(--panel)}\n.social a:hover{border-color:var(--brand);color:var(--brand);text-decoration:none}\n.epixs-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}\n.epixs-card .badge{display:inline-flex;align-items:center;gap:11px;margin-bottom:14px}\n.epixs-card .badge .m{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#14508c,#0f3e6e);color:#fff;display:grid;place-items:center;font-family:\"Archivo\";font-weight:800;font-size:15px}\n.epixs-card .badge .n{font-family:\"Archivo\";font-weight:800;font-size:17px;letter-spacing:.01em}\n.epixs-card .badge .n small{display:block;font-family:\"IBM Plex Mono\";font-weight:400;font-size:10px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}\n.epixs-card ul{margin:8px 0 0;padding-left:18px;color:var(--ink-soft);font-size:14.5px;line-height:1.7}\n\n.doc-foot{max-width:1180px;margin:0 auto;padding:30px 40px 60px;color:var(--muted);font-size:13px;font-family:\"IBM Plex Mono\";display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}\n\n/* ---------- Responsive ---------- */\n@media (max-width:900px){\n  .wrap{grid-template-columns:1fr;gap:0;padding:0 22px}\n  .toc{position:static;max-height:none;padding:26px 0 6px;border-bottom:1px solid var(--line)}\n  .toc ol{columns:2;column-gap:18px}\n  .content{padding:26px 0}\n  .cover-inner{padding:48px 24px 42px}\n  .grid2{grid-template-columns:1fr}\n  .support .body{grid-template-columns:1fr;gap:22px}\n  .doc-foot{padding:26px 22px 50px}\n}\n@media (max-width:520px){\n  body{font-size:16px}\n  .toc ol{columns:1}\n  ol.steps li{padding-left:34px}\n}\n@media print{\n  html,body{background:#fff}\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .toc{display:none}\n  .wrap{grid-template-columns:1fr;display:block;gap:0}\n  .content{padding-top:14px}\n  .feat,.note,.table-wrap,.support,.epixs-card{break-inside:avoid}\n  .section>h2{break-after:avoid}\n  h3.sub{break-after:avoid}\n  body{font-size:12.5px}\n}\n\u003c/style>\n\n\u003cheader class=\"cover\">\n  \u003cdiv class=\"grid-bg\">\u003c/div>\n  \u003cdiv class=\"cover-inner\">\n    \u003cdiv class=\"cover-badge\">\n      \u003cdiv class=\"mark\">🏗️\u003c/div>\n      \u003cdiv class=\"mark-txt\">DNK POWER CONMIX\u003csmall>Ready Mix Concrete · V.Kota, A.P.\u003c/small>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"eyebrow\">Project Documentation &amp; User Guide\u003c/div>\n    \u003ch1>DNK RMC Billing &amp; Plant Management System\u003c/h1>\n    \u003cp class=\"lede\">A complete, cloud-synced system to run a Ready Mix Concrete plant — GST invoicing, dispatch, inventory, staff payroll and tax reporting — built for the team at DNK Power Conmix.\u003c/p>\n    \u003cdiv class=\"meta-row\">\n      \u003cspan class=\"meta-chip\">\u003cspan class=\"dot\">\u003c/span> Live at \u003cb>dnk-rmc.web.app\u003c/b>\u003c/span>\n      \u003cspan class=\"meta-chip\">Version \u003cb>1.0\u003c/b>\u003c/span>\n      \u003cspan class=\"meta-chip\">September 2026\u003c/span>\n      \u003cspan class=\"meta-chip\">By \u003cb>EPIXS Media\u003c/b>\u003c/span>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"wrap\">\n  \u003cnav class=\"toc\" aria-label=\"Contents\">\n    \u003ch5>Contents\u003c/h5>\n    \u003col>\n      \u003cli>\u003ca href=\"#overview\">Overview &amp; access\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#login\">Logging in &amp; roles\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#dashboard\">Dashboard\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#billing\">Billing &amp; invoices\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#plant\">Plant &amp; staff\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#sales\">Sales tools\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#masters\">Master data\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#reports\">Reports &amp; GST\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#admin\">Admin &amp; no-code setup\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#platform\">Sync, security &amp; mobile\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#recipes\">Quick how-to recipes\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#support\">Support &amp; contact\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/nav>\n\n  \u003cmain class=\"content\">\n\n    \u003c!-- 1 -->\n    \u003csection class=\"section\" id=\"overview\">\n      \u003cdiv class=\"sec-num\">Section 01\u003c/div>\n      \u003ch2>Overview &amp; access\u003c/h2>\n      \u003cp class=\"intro\">The DNK RMC system replaces paper registers and spreadsheets with one web application that every authorised staff member can open from any device. Everything — bills, payments, stock, attendance and reports — lives in one place and stays in sync automatically.\u003c/p>\n\n      \u003ch3 class=\"sub\">What the system does\u003c/h3>\n      \u003cp>It handles the full cycle of a concrete plant: raise a GST-correct tax invoice for each dispatch, track who owes money, manage raw-material stock and vendor purchases, run staff attendance and salary, and hand your accountant ready-made GST reports. It works online across all your computers and phones, and keeps working even if the internet drops.\u003c/p>\n\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🌐\u003c/div>\u003ch4>How to open it\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Open any modern browser (Chrome, Edge, Safari) on a computer or phone and go to the address below. No installation needed.\u003c/p>\n          \u003cspan class=\"howto-label\">Address\u003c/span>\n          \u003cp style=\"margin:0\">\u003ca href=\"https://dnk-rmc.web.app\" class=\"path\" style=\"font-size:15px\">https://dnk-rmc.web.app\u003c/a>\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🧩\u003c/div>\u003ch4>How it's organised\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">A menu on the left groups every screen into five areas so you always know where to look:\u003c/p>\n          \u003cul style=\"margin:10px 0 0;padding-left:18px;color:var(--ink-soft);font-size:15px;line-height:1.7\">\n            \u003cli>\u003cb>Operations\u003c/b> — dashboard, billing, outstanding\u003c/li>\n            \u003cli>\u003cb>Plant &amp; Staff\u003c/b> — stock, vendors, attendance, payroll\u003c/li>\n            \u003cli>\u003cb>Sales Tools\u003c/b> — leads &amp; calculators\u003c/li>\n            \u003cli>\u003cb>Masters\u003c/b> — customers, grades, rates\u003c/li>\n            \u003cli>\u003cb>Insights\u003c/b> — reports, users, settings\u003c/li>\n          \u003c/ul>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 2 -->\n    \u003csection class=\"section\" id=\"login\">\n      \u003cdiv class=\"sec-num\">Section 02\u003c/div>\n      \u003ch2>Logging in &amp; user roles\u003c/h2>\n      \u003cp class=\"intro\">Each person signs in with their own username and password. What they can see and change depends on their role, so the right people get the right access.\u003c/p>\n\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🔑\u003c/div>\u003ch4>Signing in\u003c/h4>\u003c/div>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open \u003cspan class=\"path\">dnk-rmc.web.app\u003c/span> — the login screen appears.\u003c/li>\n          \u003cli>Enter your \u003cb>username\u003c/b> (or email) and \u003cb>password\u003c/b>, then press \u003cspan class=\"kbd\">Enter\u003c/span> or click \u003cb>Sign In\u003c/b>.\u003c/li>\n          \u003cli>Forgot your password? Click \u003cb>Forgot password?\u003c/b> and answer your security question to reset it.\u003c/li>\n          \u003cli>Use the \u003cb>eye icon\u003c/b> in the password box to check what you typed.\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n\n      \u003ch3 class=\"sub\">The three roles\u003c/h3>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Username\u003c/th>\u003cth>What they can do\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>\u003cspan class=\"pill b\">Admin\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"mono\">admin\u003c/span>\u003c/td>\u003ctd>Full access — every module, plus user management, settings, no-code customisation and feature toggles.\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003cspan class=\"pill g\">Accountant\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"mono\">accountant\u003c/span>\u003c/td>\u003ctd>Day-to-day billing and operations. Cannot open admin-only settings.\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>\u003cspan class=\"pill r\">Auditor\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"mono\">auditor\u003c/span>\u003c/td>\u003ctd>\u003cb>Read-only\u003c/b> — can view and download everything but cannot edit or delete.\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n\n      \u003cdiv class=\"note warn\">\n        \u003cb class=\"tag\">Change your password first\u003c/b>\n        Your initial passwords were provided separately by EPIXS Media. For security, sign in and change the Admin password immediately, and don't share the Admin login. Roles and passwords are managed in \u003cspan class=\"path\">Users &amp; Permissions\u003c/span>.\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 3 -->\n    \u003csection class=\"section\" id=\"dashboard\">\n      \u003cdiv class=\"sec-num\">Section 03\u003c/div>\n      \u003ch2>Dashboard\u003c/h2>\n      \u003cp class=\"intro\">The first screen after login. It gives you the day's picture at a glance so you know exactly where things stand before doing anything else.\u003c/p>\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">📊\u003c/div>\u003ch4>What you see\u003c/h4>\u003c/div>\n        \u003cp class=\"what\">Live figures that update as you work:\u003c/p>\n        \u003cul style=\"margin:10px 0 0;padding-left:18px;color:var(--ink-soft);font-size:15.5px;line-height:1.75\">\n          \u003cli>\u003cb>Today's dispatch\u003c/b> — total cubic metres billed today.\u003c/li>\n          \u003cli>\u003cb>This month's sales\u003c/b> — running monthly revenue.\u003c/li>\n          \u003cli>\u003cb>Outstanding\u003c/b> — total money still to be collected, and how many customers owe it.\u003c/li>\n          \u003cli>\u003cb>Recent invoices\u003c/b> — the latest bills, click any to reprint.\u003c/li>\n          \u003cli>\u003cb>Low-stock alerts\u003c/b> — materials at or below their reorder level.\u003c/li>\n        \u003c/ul>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 4 -->\n    \u003csection class=\"section\" id=\"billing\">\n      \u003cdiv class=\"sec-num\">Section 04\u003c/div>\n      \u003ch2>Billing &amp; invoices\u003c/h2>\n      \u003cp class=\"intro\">The heart of the system. Raise a GST-correct tax invoice for every concrete dispatch, keep them all searchable, and track exactly who still owes money.\u003c/p>\n\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">➕\u003c/div>\u003ch4>New Dispatch / Bill\u003c/h4>\u003c/div>\n        \u003cp class=\"what\">Creates a tax invoice. GST is worked out automatically from the customer's GSTIN and state — you never calculate tax by hand.\u003c/p>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Go to \u003cspan class=\"path\">Operations → New Dispatch / Bill\u003c/span>.\u003c/li>\n          \u003cli>Pick the \u003cb>Customer\u003c/b>. The system detects the tax type: \u003cb>CGST + SGST\u003c/b> within Andhra Pradesh, \u003cb>IGST\u003c/b> for other states, or \u003cb>No GST\u003c/b> for an unregistered buyer.\u003c/li>\n          \u003cli>Choose the \u003cb>Site/Project\u003c/b> (optional), \u003cb>Concrete Grade\u003c/b>, and \u003cb>Vehicle &amp; Driver\u003c/b>.\u003c/li>\n          \u003cli>Enter \u003cb>Quantity (Cum)\u003c/b> and \u003cb>Rate\u003c/b> — the rate auto-fills if set in the Rate Master. \u003cem>(For a \u003cb>PUMP\u003c/b> grade these two are optional.)\u003c/em>\u003c/li>\n          \u003cli>Optional: add \u003cb>Pump Charges\u003c/b> and tick \u003cb>Apply GST on pump\u003c/b> if they're taxable.\u003c/li>\n          \u003cli>Check the live \u003cb>Invoice Summary\u003c/b> on the right — taxable value, GST and grand total, plus the amount in words.\u003c/li>\n          \u003cli>Click \u003cb>Generate Invoice &amp; PDF\u003c/b>. The invoice opens ready to print or save as PDF, and is stored under Invoices.\u003c/li>\n        \u003c/ol>\n        \u003cdiv class=\"note tip\">\u003cb class=\"tag\">Good to know\u003c/b> Invoice numbers are assigned automatically (DNK/1, DNK/2 …) and stay fixed for registered buyers. For unregistered buyers the number is editable if you need to match a manual book.\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🧾\u003c/div>\u003ch4>Invoices\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Every bill you've raised, in one searchable list.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Operations → Invoices\u003c/span>.\u003c/li>\n            \u003cli>Filter by \u003cb>search\u003c/b>, \u003cb>customer\u003c/b>, or a \u003cb>date range\u003c/b> (From / To).\u003c/li>\n            \u003cli>Use the row actions to \u003cb>edit\u003c/b>, \u003cb>delete\u003c/b>, print the \u003cb>Tax Invoice\u003c/b> or \u003cb>Batch Slip\u003c/b>, or a customer \u003cb>Statement\u003c/b>.\u003c/li>\n            \u003cli>Export the whole list to Excel/CSV from the row or from Reports.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">💰\u003c/div>\u003ch4>Outstanding\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Track pending bills and record collections.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Operations → Outstanding\u003c/span>.\u003c/li>\n            \u003cli>Find the bill under \u003cb>Pending Bills\u003c/b>.\u003c/li>\n            \u003cli>Record a \u003cb>payment\u003c/b> — amount, mode and date.\u003c/li>\n            \u003cli>The balance updates instantly and the entry appears, time-stamped, under \u003cb>Recent Payments\u003c/b>.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 5 -->\n    \u003csection class=\"section\" id=\"plant\">\n      \u003cdiv class=\"sec-num\">Section 05\u003c/div>\n      \u003ch2>Plant &amp; staff\u003c/h2>\n      \u003cp class=\"intro\">Everything behind the invoice — raw materials, vendors, vehicles, and the people who run the plant.\u003c/p>\n\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">📦\u003c/div>\u003ch4>Product Inventory\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">A stock register for cement, aggregates, sand, admixtures and more.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Plant &amp; Staff → Product Inventory\u003c/span>.\u003c/li>\n            \u003cli>Add a product with its \u003cb>opening stock\u003c/b>, \u003cb>unit\u003c/b> and \u003cb>reorder level\u003c/b>.\u003c/li>\n            \u003cli>Recording a vendor \u003cb>purchase\u003c/b> adds stock automatically; use \u003cb>Stock Out\u003c/b> for usage.\u003c/li>\n            \u003cli>Items at or below reorder show a red \u003cb>LOW\u003c/b> tag and a dashboard alert.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🚛\u003c/div>\u003ch4>Vendors &amp; Purchases\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Supplier records and every purchase you make.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Plant &amp; Staff → Vendors &amp; Purchases\u003c/span>.\u003c/li>\n            \u003cli>Add a vendor (name, GSTIN, phone).\u003c/li>\n            \u003cli>Record a purchase and link it to a product to top up stock.\u003c/li>\n            \u003cli>Filter purchases by date range and export.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🧱\u003c/div>\u003ch4>Materials Received\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">An inward log of materials arriving at the plant.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Plant &amp; Staff → Materials Received\u003c/span>.\u003c/li>\n            \u003cli>Add an entry — date, material type, quantity, note.\u003c/li>\n            \u003cli>Print or export the summary when needed.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🛢️\u003c/div>\u003ch4>Vehicle Log\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Track running and fuel for each transit mixer / tipper.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Plant &amp; Staff → Vehicle Log\u003c/span>.\u003c/li>\n            \u003cli>Enter the opening and closing meter readings and fuel.\u003c/li>\n            \u003cli>Distance is calculated for you; export any time.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">👷\u003c/div>\u003ch4>Staff Attendance &amp; Payroll\u003c/h4>\u003c/div>\n        \u003cp class=\"what\">Mark daily attendance and let the system work out salary from it.\u003c/p>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open \u003cspan class=\"path\">Plant &amp; Staff → Staff Attendance\u003c/span>. For each person mark \u003cb>P\u003c/b> (present), \u003cb>A\u003c/b> (absent), \u003cb>H\u003c/b> (half-day) or \u003cb>L\u003c/b> (leave) — or use \u003cb>Mark All Present\u003c/b>. Future dates and pre-joining dates are blocked automatically.\u003c/li>\n          \u003cli>Open \u003cspan class=\"path\">Salary / Payroll\u003c/span>. Pay is calculated from attendance: \u003cb>Absent = unpaid\u003c/b>, and \u003cb>Leave = paid\u003c/b> up to the monthly allowance (only extra leave becomes loss-of-pay).\u003c/li>\n          \u003cli>Record \u003cb>advances\u003c/b> — you're warned if an advance exceeds the salary due.\u003c/li>\n          \u003cli>Print a \u003cb>payslip\u003c/b> for any employee.\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 6 -->\n    \u003csection class=\"section\" id=\"sales\">\n      \u003cdiv class=\"sec-num\">Section 06\u003c/div>\n      \u003ch2>Sales tools\u003c/h2>\n      \u003cp class=\"intro\">Helpers for winning and quoting work.\u003c/p>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🎯\u003c/div>\u003ch4>Leads &amp; Follow-up\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">A simple pipeline for enquiries.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Sales Tools → Leads &amp; Follow-up\u003c/span>.\u003c/li>\n            \u003cli>Add a lead with its stage (New → Contacted → Quoted → Won / Lost) and next follow-up date.\u003c/li>\n            \u003cli>Track pipeline value and what to chase next.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">📐\u003c/div>\u003ch4>Concrete &amp; Revenue Calculators\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Quick on-the-spot estimates.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>\u003cb>Concrete Calculator\u003c/b> — enter a volume to estimate the material needed.\u003c/li>\n            \u003cli>\u003cb>Revenue Calculator\u003c/b> — check costing and margin before quoting a rate.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 7 -->\n    \u003csection class=\"section\" id=\"masters\">\n      \u003cdiv class=\"sec-num\">Section 07\u003c/div>\n      \u003ch2>Master data\u003c/h2>\n      \u003cp class=\"intro\">Set these up once and the rest of the system fills itself in. Anything you enter here appears in the dropdowns on the billing screens.\u003c/p>\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🗂️\u003c/div>\u003ch4>The five masters\u003c/h4>\u003c/div>\n        \u003cul style=\"margin:6px 0 0;padding-left:18px;color:var(--ink-soft);font-size:15.5px;line-height:1.8\">\n          \u003cli>\u003cb>Customers\u003c/b> — name, GSTIN (validated), state and address. Drives automatic GST.\u003c/li>\n          \u003cli>\u003cb>Sites / Projects\u003c/b> — delivery sites linked to customers.\u003c/li>\n          \u003cli>\u003cb>Vehicles &amp; Drivers\u003c/b> — transit mixers, tippers and drivers.\u003c/li>\n          \u003cli>\u003cb>Concrete Grades\u003c/b> — M10, M20, M25 … each with its HSN/SAC and mix design.\u003c/li>\n          \u003cli>\u003cb>Rate Master\u003c/b> — the agreed rate per customer × grade, so bills price themselves.\u003c/li>\n        \u003c/ul>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open the item under \u003cspan class=\"path\">Masters\u003c/span>.\u003c/li>\n          \u003cli>Click \u003cb>Add\u003c/b>, fill the form, and save. GSTIN and phone numbers are checked for you.\u003c/li>\n          \u003cli>Edit or remove any record from its row.\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 8 -->\n    \u003csection class=\"section\" id=\"reports\">\n      \u003cdiv class=\"sec-num\">Section 08\u003c/div>\n      \u003ch2>Reports &amp; GST\u003c/h2>\n      \u003cp class=\"intro\">Turn your data into the files your accountant and tax filing need — in the exact formats they expect.\u003c/p>\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">📈\u003c/div>\u003ch4>Reports &amp; Export\u003c/h4>\u003c/div>\n        \u003cp class=\"what\">All exports live in one place under \u003cspan class=\"path\">Insights → Reports &amp; Export\u003c/span>.\u003c/p>\n        \u003cspan class=\"howto-label\">What you can download\u003c/span>\n        \u003cul style=\"margin:6px 0 0;padding-left:18px;color:var(--ink-soft);font-size:15.5px;line-height:1.8\">\n          \u003cli>\u003cb>All Invoices (Excel/CSV)\u003c/b> — with separate CGST, SGST and IGST columns, so it works for both intra- and inter-state tax.\u003c/li>\n          \u003cli>\u003cb>Monthly Summary\u003c/b> — bills, quantity, taxable, GST and total per month.\u003c/li>\n          \u003cli>\u003cb>GSTR Sales Register (Tally)\u003c/b> — pick a month; downloads in Tally's exact layout (D-Mon-YY dates, Dr/Cr, Grand Total) so your accountant can use it directly.\u003c/li>\n          \u003cli>\u003cb>Toll / Dispatch Register\u003c/b> and \u003cb>Bulk Invoice ZIP\u003c/b> for a whole customer or period.\u003c/li>\n        \u003c/ul>\n        \u003cspan class=\"howto-label\">How to export the GST register\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open \u003cspan class=\"path\">Reports &amp; Export\u003c/span>.\u003c/li>\n          \u003cli>Choose the \u003cb>month\u003c/b> next to \u003cem>GST Register\u003c/em>.\u003c/li>\n          \u003cli>Click \u003cb>GSTR Sales Register (Tally)\u003c/b> — the file downloads ready to hand over.\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 9 -->\n    \u003csection class=\"section\" id=\"admin\">\n      \u003cdiv class=\"sec-num\">Section 09\u003c/div>\n      \u003ch2>Admin &amp; no-code setup\u003c/h2>\n      \u003cp class=\"intro\">The Admin can shape the system without any programming — add options, turn modules on or off, manage users, import history and back everything up. All of this lives in \u003cspan class=\"path\">Settings &amp; Backup\u003c/span> and \u003cspan class=\"path\">Users &amp; Permissions\u003c/span>.\u003c/p>\n\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🧩\u003c/div>\u003ch4>Manage Lists &amp; Options — no coding\u003c/h4>\u003c/div>\n        \u003cp class=\"what\">Change the choices that appear in dropdowns across the app yourself. Great when you add a new material or a new lead stage.\u003c/p>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open \u003cspan class=\"path\">Settings → Manage Lists &amp; Options\u003c/span>.\u003c/li>\n          \u003cli>Pick a list — Dispatched Through, Product Categories, Units, Material Types or Lead Stages.\u003c/li>\n          \u003cli>\u003cb>Add\u003c/b>, \u003cb>rename\u003c/b> or \u003cb>remove\u003c/b> options; \u003cb>Reset to default\u003c/b> restores the originals.\u003c/li>\n          \u003cli>Changes apply instantly and sync to every device. Existing records keep their saved value even if you later remove an option.\u003c/li>\n        \u003c/ol>\n      \u003c/div>\n\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🎚️\u003c/div>\u003ch4>Feature Management\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Show or hide whole modules for everyone.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Settings → Feature Management\u003c/span>.\u003c/li>\n            \u003cli>Toggle any module on or off — it appears or disappears from every user's menu at once (core screens stay on).\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">👥\u003c/div>\u003ch4>Users &amp; Permissions\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Create logins and decide exactly what each can touch.\u003c/p>\n          \u003cspan class=\"howto-label\">How to use\u003c/span>\n          \u003col class=\"steps\">\n            \u003cli>Open \u003cspan class=\"path\">Insights → Users &amp; Permissions\u003c/span>.\u003c/li>\n            \u003cli>Add a user, choose a role, and tick the modules they may use.\u003c/li>\n            \u003cli>Disable a login any time without deleting its history.\u003c/li>\n          \u003c/ol>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">⬆️\u003c/div>\u003ch4>Import your history (April 2026 onward)\u003c/h4>\u003c/div>\n        \u003cp class=\"what\">Bring older records in from a spreadsheet instead of retyping them.\u003c/p>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open \u003cspan class=\"path\">Settings → Import Data\u003c/span>.\u003c/li>\n          \u003cli>Choose a module — Invoices/Sales, Materials, Vehicle Log, Customers, Vendors, Staff or Products.\u003c/li>\n          \u003cli>Click \u003cb>Download Template\u003c/b>, fill it in, and save as \u003cb>CSV or Excel (.xlsx)\u003c/b>.\u003c/li>\n          \u003cli>Choose your file and click \u003cb>Import\u003c/b>. Customers, vendors, grades and vehicles are created for you, GST on invoices is calculated automatically, and duplicates are skipped.\u003c/li>\n        \u003c/ol>\n        \u003cdiv class=\"note tip\">\u003cb class=\"tag\">Tip\u003c/b> CSV files import fully offline; Excel (.xlsx) import needs an internet connection at the moment you import.\u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"feat\">\n        \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">💾\u003c/div>\u003ch4>Backup &amp; company details\u003c/h4>\u003c/div>\n        \u003cspan class=\"howto-label\">How to use\u003c/span>\n        \u003col class=\"steps\">\n          \u003cli>Open \u003cspan class=\"path\">Settings &amp; Backup\u003c/span>.\u003c/li>\n          \u003cli>Edit \u003cb>Company Details\u003c/b> (name, GSTIN, address, bank) — these print on every invoice.\u003c/li>\n          \u003cli>Click \u003cb>Download Backup (.json)\u003c/b> to save a full copy; \u003cb>Restore\u003c/b> brings it back on any computer.\u003c/li>\n        \u003c/ol>\n        \u003cdiv class=\"note tip\">\u003cb class=\"tag\">Recommended\u003c/b> Download a backup weekly and keep it somewhere safe, in addition to the automatic cloud sync.\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 10 -->\n    \u003csection class=\"section\" id=\"platform\">\n      \u003cdiv class=\"sec-num\">Section 10\u003c/div>\n      \u003ch2>Sync, security &amp; mobile\u003c/h2>\n      \u003cp class=\"intro\">The system is built to be safe, always up to date, and usable from the plant on a phone.\u003c/p>\n      \u003cdiv class=\"grid2\">\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">☁️\u003c/div>\u003ch4>Real-time cloud sync\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Log in on two computers and both stay in step — a bill raised on one appears on the other within seconds. A small badge shows \u003cb>Synced\u003c/b>, \u003cb>Connecting\u003c/b> or \u003cb>Local only\u003c/b>. If the internet drops, the app keeps working and syncs again when it returns.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">🔒\u003c/div>\u003ch4>Security\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">Sign-in required, role-based access, validated GST and phone entries, and hardening against malicious data and scripts (Content-Security-Policy and input escaping). Invoices print clean on A4 with no browser clutter.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">📱\u003c/div>\u003ch4>Mobile ready\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">On a phone the menu becomes a slide-in drawer (tap ☰), wide tables scroll neatly, and forms stack to one column — so you can raise a bill or check outstanding from the site.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"feat\">\n          \u003cdiv class=\"feat-head\">\u003cdiv class=\"feat-ic\">⚡\u003c/div>\u003ch4>Fast &amp; lightweight\u003c/h4>\u003c/div>\n          \u003cp class=\"what\">The whole app is a single lightweight page that loads quickly and puts almost no load on the server, so it stays responsive even on modest connections.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 11 -->\n    \u003csection class=\"section\" id=\"recipes\">\n      \u003cdiv class=\"sec-num\">Section 11\u003c/div>\n      \u003ch2>Quick how-to recipes\u003c/h2>\n      \u003cp class=\"intro\">The everyday jobs, boiled down to the shortest path.\u003c/p>\n      \u003cdiv class=\"table-wrap\">\n        \u003ctable>\n          \u003cthead>\u003ctr>\u003cth>I want to…\u003c/th>\u003cth>Do this\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody>\n            \u003ctr>\u003ctd>Raise a concrete bill\u003c/td>\u003ctd>\u003cspan class=\"path\">New Dispatch / Bill\u003c/span> → pick customer, grade, vehicle → qty &amp; rate → \u003cb>Generate Invoice &amp; PDF\u003c/b>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Record a payment received\u003c/td>\u003ctd>\u003cspan class=\"path\">Outstanding\u003c/span> → find the bill → record amount, mode, date\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Re-print an old invoice\u003c/td>\u003ctd>\u003cspan class=\"path\">Invoices\u003c/span> → search → Tax Invoice / Batch Slip\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Give my accountant GST data\u003c/td>\u003ctd>\u003cspan class=\"path\">Reports &amp; Export\u003c/span> → choose month → \u003cb>GSTR Sales Register (Tally)\u003c/b>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Add a new material or lead stage\u003c/td>\u003ctd>\u003cspan class=\"path\">Settings → Manage Lists &amp; Options\u003c/span> → Add\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Import old bills from Excel\u003c/td>\u003ctd>\u003cspan class=\"path\">Settings → Import Data\u003c/span> → download template → fill → Import\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Mark attendance &amp; run salary\u003c/td>\u003ctd>\u003cspan class=\"path\">Staff Attendance\u003c/span> → mark P/A/H/L → \u003cspan class=\"path\">Salary / Payroll\u003c/span>\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Add a staff login\u003c/td>\u003ctd>\u003cspan class=\"path\">Users &amp; Permissions\u003c/span> → Add user → pick role &amp; permissions\u003c/td>\u003c/tr>\n            \u003ctr>\u003ctd>Back up everything\u003c/td>\u003ctd>\u003cspan class=\"path\">Settings &amp; Backup\u003c/span> → Download Backup (.json)\u003c/td>\u003c/tr>\n          \u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/section>\n\n    \u003c!-- 12 support -->\n    \u003csection class=\"section\" id=\"support\" style=\"border-top:none\">\n      \u003cdiv class=\"support\">\n        \u003cdiv class=\"top\">\n          \u003cdiv class=\"eyebrow\">Development &amp; Support Partner v class=\"m\">EM\u003c/div>\u003cdiv class=\"n\">EPIXS Media\u003csmall>Web · Software · Marketing\u003c/small>\u003c/div>\u003c/div>\n            \u003cp style=\"margin:0;color:var(--ink-soft);font-size:14.5px\">Results-driven partner helping businesses get online, get found and get more customers.\u003c/p>\n            \u003cul>\n              \u003cli>Web &amp; software development\u003c/li>\n              \u003cli>Mobile &amp; e-commerce apps\u003c/li>\n              \u003cli>AI, automation &amp; analytics\u003c/li>\n              \u003cli>Digital marketing &amp; hosting\u003c/li>\n            \u003c/ul>\n            \u003cdiv class=\"social\">\n              \u003ca href=\"https://facebook.com/EpixsMedia/\">Facebook\u003c/a>\n              \u003ca href=\"https://instagram.com/epixsmedia/\">Instagram\u003c/a>\n              \u003ca href=\"https://linkedin.com/company/epixs-media\">LinkedIn\u003c/a>\n              \u003ca href=\"https://x.com/epixsmedia\">X\u003c/a>\n              \u003ca href=\"https://youtube.com/@epixsmedia\">YouTube\u003c/a>\n              \u003ca href=\"https://github.com/EPIXSMedia\">GitHub\u003c/a>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n  \u003c/main>\n\u003c/div>\n\n\u003cfooter class=\"doc-foot\">\n  \u003cspan>DNK Power Conmix — RMC Billing System · Documentation v1.0\u003c/span>\n  \u003cspan>© 2026 EPIXS Media · Prepared September 2026\u003c/span>\n\u003c/footer>\n\n\u003c/html>";
/* ============ Invoice / Challan print templates (Tally-style GST invoice) ============ */

function inr(n){ return Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/* Title-case a unit-of-measure for display, e.g. CUM/cum -> Cum, job -> Job */
function tcase(s){ return String(s||'').toLowerCase().replace(/\b\w/g,m=>m.toUpperCase()); }

/* ---- Number to Indian words with paisa ---- */
function numToWords(num){
  num = Math.round(Number(num)*100)/100;
  if(isNaN(num)) num = 0;
  const neg = num < 0;                 // guard negatives (e.g. advance > salary) so the
  num = Math.abs(num);                 // recursion below never gets a negative and breaks
  const rupees = Math.floor(num);
  const paise = Math.round((num-rupees)*100);
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){ return n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:''); }
  function three(n){ return (n>=100?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):''); }
  function inWords(n){
    if(n===0) return 'Zero';
    let str='';
    const crore=Math.floor(n/10000000); n%=10000000;
    const lakh=Math.floor(n/100000); n%=100000;
    const thousand=Math.floor(n/1000); n%=1000;
    const hundred=n;
    if(crore) str+=inWords(crore)+' Crore ';
    if(lakh) str+=two(lakh)+' Lakh ';
    if(thousand) str+=two(thousand)+' Thousand ';
    if(hundred) str+=three(hundred);
    return str.trim();
  }
  let words=(neg?'INR Minus ':'INR ')+inWords(rupees)+' Rupees';
  if(paise>0) words+=' and '+two(paise)+' Paisa';
  return words+' Only';
}

/* ---- Compute GST for an invoice ----
   No GSTIN on buyer  => Domestic / Unregistered => NO GST applicable (Bill of Supply)
   Same state as seller => CGST + SGST ;  Other state => IGST */
function computeInvoice(inv, company){
  const taxable = round2(inv.qty * inv.rate);
  const noGst = !(inv.buyerGstin && String(inv.buyerGstin).trim());
  const interState = (inv.buyerStateCode||'') !== company.stateCode;
  const gstRate = noGst ? 0 : (inv.gstRate!=null ? inv.gstRate : 18);
  // Pump charges — optional; GST applies only when the "Apply GST on pump" flag is on
  // AND the buyer is GST-registered. Otherwise pump is added without tax.
  const pump = round2(+inv.pump||0);
  const pumpGst = !!inv.pumpGst && !noGst;
  const pumpTaxable = pumpGst ? pump : 0;
  const baseTaxable = round2(taxable + pumpTaxable);   // value that attracts GST
  let cgst=0,sgst=0,igst=0;
  if(!noGst){
    if(interState){ igst = round2(baseTaxable*gstRate/100); }
    else { cgst = round2(baseTaxable*(gstRate/2)/100); sgst = round2(baseTaxable*(gstRate/2)/100); }
  }
  const totalTax = round2(cgst+sgst+igst);
  const grand = round2(taxable + pump + totalTax);
  return {taxable,interState,gstRate,cgst,sgst,igst,totalTax,grand,noGst,pump,pumpGst,pumpTaxable,baseTaxable};
}
function round2(n){ return Math.round(Number(n)*100)/100; }

/* ---- Full tax invoice HTML ---- */
function invoiceHTML(inv, company, opts){
  const c = computeInvoice(inv, company);
  const isChallan = opts && opts.challan;
  const taxSummary = c.interState
    ? `<tr><td class="c">${esc(inv.hsn)}</td><td class="r">${inr(c.baseTaxable)}</td><td class="c">${c.gstRate}%</td><td class="r">${inr(c.igst)}</td><td class="r">${inr(c.totalTax)}</td></tr>`
    : `<tr><td class="c">${esc(inv.hsn)}</td><td class="r">${inr(c.baseTaxable)}</td><td class="c">${c.gstRate/2}%</td><td class="r">${inr(c.cgst)}</td><td class="c">${c.gstRate/2}%</td><td class="r">${inr(c.sgst)}</td><td class="r">${inr(c.totalTax)}</td></tr>`;
  const taxSummaryHead = c.interState
    ? `<tr><th rowspan="2">HSN/SAC</th><th rowspan="2">Taxable Value</th><th colspan="2">IGST</th><th rowspan="2">Total Tax Amount</th></tr><tr><th>Rate</th><th>Amount</th></tr>`
    : `<tr><th rowspan="2">HSN/SAC</th><th rowspan="2">Taxable Value</th><th colspan="2">CGST</th><th colspan="2">SGST</th><th rowspan="2">Total Tax Amount</th></tr><tr><th>Rate</th><th>Amount</th><th>Rate</th><th>Amount</th></tr>`;

  const docTitle = isChallan ? 'Delivery Challan' : (c.noGst ? 'Invoice (Bill of Supply)' : 'Tax Invoice');
  return `<!doctype html><html><head><meta charset="utf-8"><title>${docTitle} ${esc(inv.no)}</title>
  <style>
    /* margin:0 removes the browser-added date/URL/page-number header & footer.
       Page breathing room comes from body padding instead. */
    @page{size:A4;margin:0}
    *{box-sizing:border-box}
    html,body{margin:0}
    /* A4 with a comfortable buffer so the whole invoice always fits on one page. */
    body{font-family:"Segoe UI",Arial,sans-serif;color:#111;font-size:11px;padding:9mm}
    .doc{border:1px solid #000}
    .title{text-align:center;font-weight:700;padding:5px;font-size:13px;position:relative}
    .title .copy{position:absolute;right:6px;top:5px;font-size:9px;font-weight:400;color:#555}
    table{border-collapse:collapse;width:100%}
    td,th{border:1px solid #000;padding:4px 6px;vertical-align:top}
    .noborder td{border:none}
    /* Fixed column model so the header centre divider lines up exactly with the
       items table's Description|HSN divider (both sit at 100% - 380px). */
    .head,.items{table-layout:fixed}
    /* One even 1px frame: the .doc border is the sole outer edge, so strip the
       inner tables' outer perimeter (left/right) to avoid a doubled 2px line.
       The header's centre divider and all internal grid lines are preserved. */
    .doc>table>tbody>tr>td:last-child,.doc>table>tbody>tr>th:last-child{border-right:0}
    .doc>table:not(.head)>tbody>tr>td:first-child,.doc>table:not(.head)>tbody>tr>th:first-child{border-left:0}
    .head>tbody>tr:first-child>td:first-child,.head>tbody>tr:last-child>td:first-child{border-left:0}
    .r{text-align:right}.c{text-align:center}.b{font-weight:700}
    .head td{vertical-align:top}
    .seller b{font-size:12px}
    .small{font-size:10px}

/* local calendar date (not UTC), and timezone-safe date arithmetic on YYYY-MM-DD */
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
function addDaysISO(iso,n){ const [y,m,d]=iso.split('-').map(Number); const dt=new Date(Date.UTC(y,m-1,d)); dt.setUTCDate(dt.getUTCDate()+n); return dt.toISOString().slice(0,10); }
function diffDaysISO(a,b){ const A=a.split('-').map(Number),B=b.split('-').map(Number); return (Date.UTC(A[0],A[1]-1,A[2])-Date.UTC(B[0],B[1]-1,B[2]))/86400000; }

/* Client-side password obfuscation (cyrb64). NOTE: this is not strong crypto —
   localStorage data is readable on the device regardless; it just avoids storing
   plain-text passwords. Real account security needs Firebase Auth (server-side). */
function hashStr(s){
  s='dnk$'+String(s==null?'':s);
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){ const ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507); h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507); h2^=Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function normKey(s){ return String(s==null?'':s).trim().toLowerCase(); }

/* HTML-escape any user-controlled value before it goes into innerHTML / attributes.
   Critical now that data syncs via Firestore — a value poisoned on one device would
   otherwise execute as stored XSS in every other user's browser. Safe in both text
   and double-quoted-attribute contexts. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- Input validation & normalisation ----------------
   Standard GSTIN (15 chars): 2 state digits + 10-char PAN (5 letters, 4 digits,
   1 letter) + 1 entity char (1-9/A-Z) + fixed 'Z' + 1 checksum char (0-9/A-Z).
   e.g. 37ATRPK7789E1ZU, 29AAPCS5668E1ZP, 29AAQFN9165M1Z6 (checksum can be a digit). */
const GSTIN_RE = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
function gstinValid(s){ return GSTIN_RE.test(String(s||'').toUpperCase().trim()); }
/* Indian mobile number: exactly 10 digits, starts 6-9, and not an obviously
   fake value (all-same like 1111111111, or a short block repeated like
   0101010101 / 1231231231). Empty = allowed (phone is optional). */
function phoneValid(s){
  s=String(s||'').trim();
  if(s==='') return true;
  if(!/^[6-9][0-9]{9}$/.test(s)) return false;        // 10 digits, valid mobile prefix
  if(/^(.)\1{9}$/.test(s)) return false;              // all identical digits
  for(let len=1;len<=5;len++){ const p=s.slice(0,len); if(p.repeat(Math.ceil(10/len)).slice(0,10)===s) return false; }
  if('0123456789'.includes(s)||'9876543210'.includes(s)) return false; // pure sequential
  return true;
}

function fmtInput(id,transform){ const e=document.getElementById(id); if(!e)return; const p=e.selectionStart; e.value=transform(e.value); try{e.setSelectionRange(p,p);}catch(_){}
}
function upperInput(id){ fmtInput(id,v=>v.toUpperCase()); }
function digitsInput(id,max){ fmtInput(id,v=>{ v=v.replace(/\D/g,''); return max?v.slice(0,max):v; }); }
function lettersInput(id){ fmtInput(id,v=>v.replace(/[^A-Za-z .]/g,'')); }
function plateInput(id){ fmtInput(id,v=>v.replace(/[^A-Za-z0-9 ]/g,'').toUpperCase()); }
function decimalInput(id){ fmtInput(id,v=>{ v=v.replace(/[^0-9.]/g,''); const i=v.indexOf('.'); if(i>=0) v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,''); return v; }); }
function phoneOk(s){ s=String(s||'').trim(); return s==='' || /^[0-9]{1,10}$/.test(s); }

/* Storage layer — uses localStorage, falls back to in-memory if unavailable (sandboxed host) */
const store = (()=>{
  try{ const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);
    return {get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v)}; }
  catch(e){ const m={}; return {get:k=>m[k]??null,set:(k,v)=>{m[k]=v;}}; }
})();
let DB = load();
function load(){
  try{ const raw=store.get(DB_KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){}
  const s=seed(); store.set(DB_KEY,JSON.stringify(s)); return s;
}
function migrate(d){
  const s=seed();
  ['grades','customers','sites','vehicles','rates','invoices','payments','users','leads','products','stockmoves','staff','attendance','advances','salaryRecords','vendors','purchases','materials','vehicleLogs','activity'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=s[k]; });
  // SECURITY: the shared cloud doc is writable by any signed-in (even anonymous)
  // client, so every record id is untrusted. Real ids are only ever [a-z0-9] (uid()
  // / seed), so stripping other characters is a no-op for genuine data while it
  // neutralises any id crafted to break out of an inline onclick="fn('<id>')" handler.
  ['grades','customers','sites','vehicles','rates','invoices','payments','users','leads','products','stockmoves','staff','attendance','advances','salaryRecords','vendors','purchases','materials','vehicleLogs'].forEach(k=>{
    (d[k]||[]).forEach(it=>{ if(it&&it.id!=null) it.id=String(it.id).replace(/[^A-Za-z0-9_-]/g,''); });
  });
  if(!d.company) d.company=s.company;
  if(d.seq==null) d.seq=s.seq;
  // backfill grade mix designs
  d.grades.forEach(g=>{ if(!g.mix){ const sg=s.grades.find(x=>x.name===g.name); g.mix = sg?sg.mix:{...DEFAULT_MIX}; } });
  // backfill staff HR fields
  d.staff.forEach(st=>{ if(st.monthlySalary==null) st.monthlySalary=(st.wage||0)*26; if(st.leaveAllowed==null) st.leaveAllowed=2; if(st.joinDate==null) st.joinDate=''; });
  // feature toggles + user credentials
  if(!d.features||typeof d.features!=='object') d.features={};
  d.users.forEach(u=>{ if(!u.pwd) u.pwd=hashStr((u.username||'user')+'@123'); if(!u.secQ){ u.secQ='In which town is the plant located?'; u.secA=hashStr('vkota'); } if(u.perms && u.perms.manual==null) u.perms.manual=1; });
  return d;
}

function uid(p){ return p+Math.random().toString(36).slice(2,8); }

/* ================= CLOUD SYNC (Firestore single-doc, real-time) =================
   Every device signs in anonymously and shares ONE document (app/main) holding the
   whole DB as JSON. Each device listens for remote changes and pushes local changes
   (debounced), so multiple admins on different machines stay in sync. If Firestore
   is unavailable (offline / SDK blocked / provider off) the app runs local-only and
   never blocks. Whole-doc last-write-wins; the live listener keeps the write window
   tiny for a small team. */
const CLOUD = { ref:null, ready:false, applying:false, pushT:null, lastJSON:'', pending:null, status:'off' };
function cloudInit(){
  if(!window.fbDb || !window.fbAuth){ CLOUD.status='off'; cloudBadge(); return; }
  CLOUD.status='connecting'; cloudBadge();
  const start=()=>{
    try{ CLOUD.ref = window.fbDb.collection('app').doc('main'); }
    catch(e){ CLOUD.status='off'; cloudBadge(); return; }
    CLOUD.ref.onSnapshot(snap=>{
      if(!snap.exists){ cloudPush(true); return; }           // first run — seed cloud from local
      const data=snap.data();
      if(!data || typeof data.json!=='string') return;
      if(snap.metadata && snap.metadata.hasPendingWrites) return; // ignore our own optimistic echo
      if(data.json===CLOUD.lastJSON) return;                 // nothing new
      if(document.getElementById('modalBg')){ CLOUD.pending=data.json; return; } // defer while editing
      cloudApply(data.json);
    }, err=>{ CLOUD.status='error'; cloudBadge(); });
    CLOUD.ready=true; CLOUD.status='synced'; cloudBadge();
  };
  if(window.fbAuth.currentUser){ start(); }
  else { window.fbAuth.signInAnonymously().then(start).catch(()=>{ CLOUD.status='off'; cloudBadge(); }); }
}
function cloudApply(json){
  try{
    const remote=JSON.parse(json);
    CLOUD.applying=true;
    DB=migrate(remote);
    CLOUD.lastJSON=json;
    store.set(DB_KEY,JSON.stringify(DB));
    if(loggedIn) renderApp(); else renderLogin();
    CLOUD.applying=false;
    CLOUD.status='synced'; cloudBadge();
  }catch(e){ CLOUD.applying=false; }
}
function cloudPush(force){
  if(!CLOUD.ref) return;
  if(CLOUD.applying && !force) return;
  const json=JSON.stringify(DB);
  if(json===CLOUD.lastJSON && !force) return;
  if(json.length>1000000){                       // Firestore hard limit is 1 MB per document
    CLOUD.status='error'; cloudBadge();
    toast('Data too large for cloud sync (1 MB limit) — saved locally only','err');
    return;
  }
  CLOUD.lastJSON=json;
  CLOUD.ref.set({json, at:Date.now(), by:(ME&&ME.name)||'system'})
    .then(()=>{ CLOUD.status='synced'; cloudBadge(); })
    .catch(()=>{ CLOUD.status='error'; cloudBadge(); });
}
function cloudSchedulePush(){
  if(!CLOUD.ref || CLOUD.applying) return;
  clearTimeout(CLOUD.pushT);
  CLOUD.pushT=setTimeout(()=>cloudPush(false), 600);
}
function cloudBadge(){
  if(typeof document==='undefined' || !document.body) return;
  let b=document.getElementById('cloudBadge');
  if(!b){ b=document.createElement('div'); b.id='cloudBadge'; b.className='cloud-badge'; document.body.appendChild(b); b.onclick=()=>cloudPush(true); }
  const map={synced:['☁ Synced','ok'],error:['⚠ Offline','err'],off:['☁ Local only','off'],connecting:['☁ Connecting…','off']};
  const s=map[CLOUD.status]||map.off; b.textContent=s[0]; b.className='cloud-badge '+s[1];
  b.title='Cloud sync: '+s[0]+(CLOUD.ref?' — click to force a sync':'');
}
